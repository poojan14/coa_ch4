<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COA Chapter 4</title>
<meta name="description" content="COA Chapter 4, interactive: addressing modes, instruction types, status bits, RISC vs CISC and microprogrammed control.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* Same system as the DIP Practicals site: sticky top bar, contents sidebar, one topic per page,
   short theory first, then a "Try it" bench. Blue = accent and 1-bits. */
:root{
  --bg:#FFFFFF; --surface:#F5F7FA; --surface-2:#EBF1F8; --line:#DCE3EB;
  --ink:#1A2433; --ink-2:#4A5568; --muted:#718096;
  --blue:#1F4E8C; --blue-ink:#173D6E; --blue-soft:#E7EFF9; --on-blue:#FFFFFF;
  --green:#2E7D5B; --green-soft:#E6F3EC; --red:#B4472F; --red-soft:#FBEAE5;
  --yellow-soft:#FFF4CC; --off:#E4E9EF;
  --serif:"Source Serif 4", Cambria, Georgia, serif;
  --sans:"Source Sans 3", Calibri, "Segoe UI", Arial, sans-serif;
  --mono:"Source Code Pro", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151A21; --surface:#1C232C; --surface-2:#22303F; --line:#2F3B49;
  --ink:#E6EBF1; --ink-2:#B8C2CF; --muted:#8C99A9;
  --blue:#7FAEE8; --blue-ink:#A8C8F0; --blue-soft:#1F3049; --on-blue:#10161D;
  --green:#6CC59B; --green-soft:#1C3328; --red:#EC8A72; --red-soft:#3A2420;
  --yellow-soft:#3B3418; --off:#26303C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151A21; --surface:#1C232C; --surface-2:#22303F; --line:#2F3B49;
  --ink:#E6EBF1; --ink-2:#B8C2CF; --muted:#8C99A9;
  --blue:#7FAEE8; --blue-ink:#A8C8F0; --blue-soft:#1F3049; --on-blue:#10161D;
  --green:#6CC59B; --green-soft:#1C3328; --red:#EC8A72; --red-soft:#3A2420;
  --yellow-soft:#3B3418; --off:#26303C; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
html{scroll-padding-top:70px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
code{font-family:var(--mono);font-size:.9em;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 5px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 18px}
.top .menu{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 12px;cursor:pointer}
.top .ttl{font-family:var(--serif);font-weight:700;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{color:var(--muted);font-family:var(--sans);font-weight:400;font-size:15px;margin-left:8px}
.top .theme{border:1px solid var(--line);background:var(--bg);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:18px;line-height:1}
.progbar{height:3px;background:var(--line);position:sticky;top:calc(57px + env(safe-area-inset-top,0px));z-index:19}
.progbar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}

/* layout */
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);max-width:1400px;margin:0 auto}
.toc{position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto;padding:22px 14px 40px 22px;border-right:1px solid var(--line)}
.toc h4{font-size:13px;color:var(--muted);font-weight:600;margin:18px 0 6px 8px}
.toc h4:first-child{margin-top:0}
.toc ol{list-style:none;margin:0;padding:0}
.toc a{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:6px;text-decoration:none;color:var(--ink-2);font-size:15px;line-height:1.35}
.toc a:hover{background:var(--surface)}
.toc a[aria-current="page"]{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.toc .tick{width:14px;flex:none;color:var(--green);font-size:13px}
.scrim{display:none}
main{padding:36px clamp(16px,5vw,64px) 40px;min-width:0}
.sec{max-width:900px}
.sec.wide{max-width:1240px}
.kicker{color:var(--blue);font-weight:600;font-size:15px;margin:0 0 4px}
h1{font-family:var(--serif);font-size:clamp(30px,4vw,42px);line-height:1.15;margin:0 0 14px;text-wrap:balance}
h2{font-family:var(--serif);font-size:clamp(26px,3.2vw,34px);line-height:1.2;margin:0 0 12px;text-wrap:balance}
h3{font-family:var(--serif);font-size:21px;margin:28px 0 8px}
p{margin:0 0 14px}
.lead{font-size:19px;color:var(--ink-2);max-width:66ch}
.prose{max-width:68ch}
.muted{color:var(--muted)}
.btn{border:1px solid var(--blue);background:var(--blue);color:var(--on-blue);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--blue);border-color:var(--line)}
.btn.sm{padding:5px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.plan{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.plan li{border-bottom:1px solid var(--line)}
.plan a{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;padding:12px 4px;text-decoration:none;color:var(--ink)}
.plan a:hover{background:var(--surface)}
.plan .n{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--blue);grid-row:span 2}
.plan b{font-weight:600}
.plan span{color:var(--ink-2);font-size:15px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:14px 0}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--bg)}
.box h4{margin:0 0 4px;font-size:17px}
.box p,.box li{color:var(--ink-2);font-size:16px}
.box ul{margin:0;padding-left:20px}
.box p:last-child{margin:0}
.callout{border-left:4px solid var(--blue);background:var(--blue-soft);padding:12px 16px;border-radius:0 8px 8px 0;margin:18px 0;max-width:72ch}
.callout p:last-child{margin:0}
.formula{font-family:var(--mono);font-size:16px;padding:6px 14px;background:var(--surface);border-radius:8px;display:inline-block;margin:4px 8px 12px 0}

/* try-it */
.try{border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;margin:22px 0;background:var(--surface);min-width:0}
.try-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.badge{font-size:13px;font-weight:700;background:var(--blue);color:var(--on-blue);border-radius:4px;padding:1px 8px}
.try-h b{font-size:18px}
.try-h .sub{color:var(--muted);font-size:15px}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.lbl:first-child{margin-top:0}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:15px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:15px}
.ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.op{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;cursor:pointer;line-height:1.25}
.op:hover{border-color:var(--blue)}
.op b{font-family:var(--mono);font-size:14px;display:block}
.op small{font-size:13px;color:var(--muted)}
.note{font-size:15px;color:var(--ink-2);margin:12px 0 0;max-width:72ch}
input[type=number],input[type=text],select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg);font-family:var(--mono);font-size:15px;width:92px}
select{width:auto;max-width:100%}
label.fld{display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:600;color:var(--muted)}
label.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-weight:600;font-size:15px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:700px){.split{grid-template-columns:minmax(0,1fr)}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin:12px 0;background:var(--bg)}
table.t{width:100%;border-collapse:collapse;font-size:15.5px}
table.t th{text-align:left;font-weight:600;padding:7px 12px;background:var(--surface);border-bottom:1px solid var(--line);font-size:14px}
table.t td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.m{font-family:var(--mono);font-size:14.5px;white-space:nowrap}
table.t tr.sel td{background:var(--yellow-soft)}
table.t tr.sel2 td{background:var(--blue-soft)}
table.t input[type=number]{width:80px}

/* bits */
.bits{display:inline-flex;gap:4px;align-items:center}
.bit{font-family:var(--mono);width:30px;height:36px;border:1px solid var(--line);background:var(--off);color:var(--muted);border-radius:5px;font-weight:700;cursor:pointer;padding:0;font-size:15px}
.bit.on{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.bit:disabled{cursor:default}
.bit.g{margin-right:8px}
.bit.hl{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--green)}
@media (max-width:440px){.bit{width:24px;height:32px;font-size:13px}.bit.g{margin-right:5px}}
.bitline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bitname{font-family:var(--mono);font-size:14px;color:var(--muted);min-width:84px}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.cell{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.cell small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.cell strong{font-family:var(--mono);font-size:22px;display:block;font-variant-numeric:tabular-nums}
.cell .sub{font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.cell.hot{border-color:var(--blue);background:var(--blue-soft)}
.cell.hot strong{color:var(--blue-ink)}
.cell input{width:100%;font-size:18px;font-weight:700;margin:2px 0}
ol.steps{margin:0;padding-left:22px;font-family:var(--mono);font-size:14.5px}
ol.steps li{margin-bottom:3px}
.fb{font-size:15px;padding:8px 12px;border-radius:8px;margin-top:10px}
.fb.ok{background:var(--green-soft);color:var(--green)}
.fb.no{background:var(--red-soft);color:var(--red)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px}
.tag.ea{background:var(--blue);color:var(--on-blue)}
.tag.ptr{background:var(--green);color:var(--on-blue)}
.tag.ins{background:var(--surface-2);color:var(--muted)}
.log{font-family:var(--mono);font-size:13.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:56px;max-height:200px;overflow:auto}
.log div{padding:2px 0;border-bottom:1px dashed var(--line);white-space:pre-wrap}
.log div:first-child{font-weight:600}
.log div:not(:first-child){color:var(--muted)}
.log .err{color:var(--red)}
.stk{display:flex;flex-direction:column-reverse;gap:4px;min-height:36px}
.stk span{font-family:var(--mono);font-size:14px;background:var(--bg);border:1px solid var(--line);padding:2px 10px;border-radius:5px}
.stk span:last-child{border-color:var(--blue)}
.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{background:var(--yellow-soft);box-shadow:0 0 0 2px var(--blue)}100%{}}
.flags{display:flex;gap:8px;flex-wrap:wrap}
.flag{min-width:96px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.flag b{font-family:var(--mono);font-size:20px;display:block}
.flag small{font-size:13px;color:var(--muted);display:block;line-height:1.3}
.flag.set{background:var(--blue-soft);border-color:var(--blue)}
.flag.set b{color:var(--blue-ink)}
.brs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.brx{font-family:var(--mono);font-size:14px;padding:8px 10px;border-radius:8px;border:1px dashed var(--line);color:var(--muted);background:var(--bg)}
.brx b{display:block;font-size:15px}
.brx.take{border:1px solid var(--green);background:var(--green-soft);color:var(--green)}
.sum{font-family:var(--mono);font-size:16px;display:grid;grid-template-columns:auto auto;gap:3px 14px;justify-content:start;overflow-x:auto}
.sum .k{color:var(--muted);font-size:13px;text-align:right;align-self:center}
.sum .v{white-space:pre;letter-spacing:.12em}
.sum .v.total{border-top:2px solid var(--ink);padding-top:3px;font-weight:700}
.sum .c{color:var(--blue);font-weight:700}
.sum .x{color:var(--red);font-weight:700}
.prog{font-family:var(--mono);font-size:14px;width:100%;border-collapse:collapse}
.prog td{padding:4px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.prog td.cm{color:var(--muted);white-space:normal;font-family:var(--sans)}
.prog tr.cur td{background:var(--yellow-soft)}
.prog tr.cur td:first-child{box-shadow:inset 4px 0 0 var(--blue)}
.enc{display:flex;flex-direction:column;gap:6px}
.encl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:14px}
.encl code{min-width:150px}
.bytes{display:flex;gap:2px}
.bytes i{display:block;width:13px;height:18px;border-radius:2px;background:var(--blue)}
.bytes.c i{background:var(--green)}
.meter{font-size:14px;margin-bottom:8px}
.meter .bar{height:10px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}
.meter .bar i{display:block;height:100%;background:var(--blue)}
.meter .bar.c i{background:var(--green)}
.sort{display:flex;flex-direction:column;gap:6px}
.card{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);flex-wrap:wrap}
.card .q{flex:1 1 220px;min-width:0}
.card.ok{border-color:var(--green);background:var(--green-soft)}
.card.no{border-color:var(--red);background:var(--red-soft)}
.card .verdict{font-size:14px;font-weight:700}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.flipc{text-align:left;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;min-height:96px}
.flipc b{display:block;margin-bottom:4px}
.flipc span{font-size:15px;color:var(--muted)}
.flipc.open{background:var(--blue-soft);border-color:var(--blue)}
.flipc.open span{color:var(--ink)}
.org{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:600px){.org{grid-template-columns:repeat(2,minmax(0,1fr))}}
.blk{border:1.5px solid var(--line);border-radius:8px;padding:10px;font-size:15px;background:var(--bg)}
.blk b{display:block;font-family:var(--mono);font-size:13px}
.blk.on{border-color:var(--blue);background:var(--blue-soft)}
.fields{display:grid;grid-template-columns:3fr 3fr 3fr 2fr 2fr 7fr;gap:4px}
.fd{border-radius:6px;padding:6px;background:var(--bg);border:1px solid var(--line);min-width:0;text-align:center}
.fd small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.fd code{display:block;border:0;background:none;font-size:13.5px;font-weight:700;letter-spacing:.06em;padding:0}
.fd span{display:block;font-family:var(--mono);font-size:12.5px;color:var(--blue-ink);overflow-wrap:anywhere}
@media (max-width:560px){.fields{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wgroups{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.wg{display:flex;flex-direction:column;gap:4px}
.wg small{font-size:12.5px;color:var(--muted);font-weight:600;text-align:center}
.mux{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.mux span{font-family:var(--mono);font-size:13px;padding:6px;border-radius:6px;border:1px dashed var(--line);text-align:center;color:var(--muted);overflow-wrap:anywhere;background:var(--bg)}
.mux span.pick{border:1.5px solid var(--blue);background:var(--blue-soft);color:var(--ink);font-weight:700}
.seqblk{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg)}
.seqblk > b{font-family:var(--mono);font-size:13px;display:block;margin-bottom:6px}
.arrow{font-family:var(--mono);font-size:13px;color:var(--blue);text-align:center;margin:4px 0}
.mpgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.mpgrid{grid-template-columns:minmax(0,1fr)}}
.regs6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.regs6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.phase{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--blue);color:var(--on-blue)}
.memtbl input[type=number]{width:72px;font-size:14px;padding:3px 6px}
.memtbl select{font-size:14px;padding:3px}
.mk{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--blue)}
.q{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 10px;background:var(--bg)}
.q p{font-weight:600;margin:0 0 8px}
.q .ch{display:flex;flex-direction:column;gap:6px}
.q .ch button{text-align:left;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--bg);cursor:pointer}
.q .ch button:disabled{cursor:default}
.q .ch button.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:600}
.q .ch button.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.q .why{font-size:15px;color:var(--ink-2);margin-top:8px}
.scorebar{display:flex;gap:18px;align-items:baseline;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;margin:0 0 12px;flex-wrap:wrap}
.scorebar b{font-family:var(--serif);font-size:26px;color:var(--blue)}
details summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:15px}
.calcbox{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px 16px;margin-top:14px}
.calcbox h4{margin:0 0 8px;font-size:16px;color:var(--blue-ink)}
.calcbox ol{margin:0;padding-left:22px}
.calcbox ol>li{margin-bottom:8px}
.calcbox ul{margin:4px 0 0;padding-left:20px}
pre.calc{font-family:var(--mono);font-size:15px;background:var(--surface);border-radius:8px;padding:10px 14px;margin:8px 0;overflow-x:auto;line-height:1.45}
.calcbox .tbl-wrap{margin:8px 0}
.calcbox table.t{font-size:14px}
.calcbox table.t td,.calcbox table.t th{padding:4px 10px}
.calcbox .concl{background:var(--blue-soft);border-radius:8px;padding:8px 12px;margin-top:6px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:900px;margin-top:44px;padding-top:18px;border-top:1px solid var(--line)}
.pager .mid{color:var(--muted);font-size:14px;text-align:center}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .toc{position:fixed;left:0;top:0;bottom:0;width:300px;max-width:85vw;height:100%;background:var(--bg);z-index:40;transform:translateX(-105%);transition:transform .25s;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  body.toc-open .toc{transform:none}
  body.toc-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
  .top .ttl span{display:none}
}
@media (min-width:981px){.top .menu{display:none}}

<script>
/* ================= HELPERS ================= */
const $=(s,r=document)=>r.querySelector(s);

const binN=(v,n)=>{let s='';for(let i=n-1;i>=0;i--)s+=(v>>i)&1;return s};

function bitsHTML(v,n,id,{editable=true,hl=0,inbit=-1}={}){

function flash(el){if(!el)return;el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}

const tryBox=(title,sub,body)=>`<div class="try"><div class="try-h"><span class="badge">Try it</span><b>${title}</b><span class="sub">${sub||''}</span></div>${body}</div>`;
const seg=(opts,cur,id)=>`<div class="seg" role="group" id="${id}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${String(v)===String(cur)}">${l}</button>`).join('')}</div>`;

const tbl=(head,rows)=>`<div class="tbl-wrap"><table class="t"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="m"':''}>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;

/* ---------- step-by-step calculation helpers ---------- */
const bin8=v=>grp(binN(v,8));
const calcBox=(t,inner)=>`<div class="calcbox"><h4>${t}</h4>${inner}</div>`;
function stepAdd(a,b,cin,{la='A',lb='B'}={}){
  let c=cin,r=0,rows='';const car=[cin];
  for(let i=0;i<8;i++){const x=(a>>i)&1,y=(b>>i)&1,s=x+y+c,o=s&1,co=s>>1;r|=o<<i;
    rows+=`<tr${i===7?' class="sel"':''}><td class="m">${i}</td><td class="m">${x}</td><td class="m">${y}</td><td class="m">${c}</td><td class="m">${x}+${y}+${c} = ${s}</td><td class="m"><b>${o}</b></td><td class="m">${co}${i===7?' (this is C8)':''}</td></tr>`;c=co;car.push(c);}
  return{r,c,car,html:`<div class="tbl-wrap"><table class="t"><tr><th>Bit</th><th>${la}</th><th>${lb}</th><th>Carry in</th><th>Sum</th><th>Write</th><th>Carry out</th></tr>${rows}</table></div>`};
}
function colView(a,b,cin,r,cout,la,lb,cl){
  return `<pre class="calc">    ${bin8(a)}   ${la}\n  + ${bin8(b)}   ${lb}${cin?'\n  +         1   carry in':''}\n  -----------\n  ${cout} ${bin8(r)}   result = ${r}\n  ↑\n  ${cl||'C = '+cout}</pre>`;
}
function bitOpTable(v,m,op){
  const why={AND:['mask 0 → cleared','mask 1 → kept'],OR:['mask 0 → kept','mask 1 → set to 1'],XOR:['mask 0 → kept','mask 1 → flipped']};
  const r=LGOPS[op](v,m),nm=op==='CLR'||op==='COM';let rows='';
  for(let i=7;i>=0;i--){const x=(v>>i)&1,y=(m>>i)&1,o=(r>>i)&1;
    const w=op==='CLR'?'cleared':op==='COM'?'inverted':why[op][y];
    rows+=`<tr${x!==o?' class="sel2"':''}><td class="m">${i}</td><td class="m">${x}</td>${nm?'':`<td class="m">${y}</td>`}<td class="m"><b>${o}</b></td><td>${w}${x!==o?' (changed)':''}</td></tr>`;}
  return `<div class="tbl-wrap"><table class="t"><tr><th>Bit</th><th>Operand</th>${nm?'':'<th>Mask</th>'}<th>Result</th><th>Why</th></tr>${rows}</table></div>`;
}
function logicCalc(v,m,op,r){
  const nm=op==='CLR'||op==='COM';
  return calcBox('Step-by-step calculation',`<ol><li>Line up the operand ${bin8(v)}${nm?'':' and the mask '+bin8(m)} bit by bit.</li>
<li>Apply ${op} to each bit on its own:${bitOpTable(v,m,op)}</li>
<li>Result: ${bin8(r)} = ${r} (hex ${hex(r)}). The blue rows are the bits that changed.</li></ol>`);
}
function arithCalc(k,B){
  const a=B.AC,b=B.R1,d=v=>`${v} = ${bin8(v)}`;let h='',c='';
  if(k==='ADD'||k==='ADDC'){
    const cin=k==='ADDC'?B.C:0,S=stepAdd(a,b,cin,{la:'AC',lb:'R1'}),t=a+b+cin;
    h=`<li>Write both numbers in 8-bit binary: AC = ${d(a)}, R1 = ${d(b)}${k==='ADDC'?`. ADDC also adds the old carry, C = ${cin}`:''}.</li>
<li>Add column by column, starting at bit 0. A sum of 2 writes 0 and carries 1; a sum of 3 writes 1 and carries 1.${S.html}</li>
<li>The same addition written out:${colView(a,b,cin,S.r,S.c,'AC = '+a,'R1 = '+b)}</li>
<li>Decimal check: ${a} + ${b}${cin?' + 1':''} = ${t}. ${t>255?`That is more than 255, so it does not fit in 8 bits. AC keeps ${t} − 256 = ${S.r}, and the 256 leaves bit 7 as <b>C = 1</b>.`:`That fits in 8 bits (at most 255), so nothing leaves bit 7: <b>C = 0</b>.`}</li>`;
    c='For ADD, C = 1 means the unsigned result was too big for 8 bits.';
  }else if(k==='SUB'||k==='SUBB'){
    const cin=k==='SUBB'?B.C:1,bc=(~b)&255,S=stepAdd(a,bc,cin,{la:'AC',lb:'R1′'}),t=a+bc+cin;
    const bor=1-cin,real=a-b-(k==='SUBB'?bor:0),expr=`${a} − ${b}${k==='SUBB'&&bor?' − 1':''}`;
    h=`<li>The ALU has no subtractor, so it adds instead: ${k==='SUB'?'AC − R1 = AC + R1′ + 1':'AC − R1 − borrow = AC + R1′ + C, where borrow = C′'}.</li>
<li>Write the numbers in binary: AC = ${d(a)}, R1 = ${d(b)}.</li>
<li>Complement R1 (flip every bit): R1′ = ${bin8(bc)}.${k==='SUB'?` R1′ + 1 = ${bin8((bc+1)&255)} is the 2's complement of R1, worth 256 − ${b} = ${256-b}.`:` The carry in is the old C = ${cin}, so borrow = ${bor}.`}</li>
<li>Add AC + R1′ with carry in = ${cin} (it enters at bit 0):${S.html}</li>
<li>The same addition written out:${colView(a,bc,cin,S.r,S.c,'AC = '+a,'R1′')}</li>
<li>Decimal check: the ALU computed ${a} + ${bc} + ${cin} = ${t}${t>255?` = 256 + ${t-256}. The 256 leaves bit 7 as <b>C = 1</b> and AC keeps ${S.r}. C = 1 means <b>no borrow</b>: ${expr} = ${real} is not negative.`:`, which is less than 256, so nothing leaves bit 7: <b>C = 0</b>. C = 0 means <b>a borrow</b>: ${expr} = ${real} is negative, and AC = ${S.r} is its 8-bit pattern (256 − ${-real}).`}</li>`;
    c='For SUB, C = 1 means no borrow (AC ≥ R1). C = 0 means a borrow happened (AC < R1).';
  }else if(k==='INC'||k==='DEC'){
    const y=k==='INC'?1:255,S=stepAdd(a,y,0,{la:'AC',lb:k==='INC'?'+1':'−1'}),e=k==='INC'?a+1:a-1;
    h=`<li>AC = ${d(a)}. ${k==='INC'?'INC adds 0000 0001.':"DEC adds 1111 1111, which is −1 in 2's complement."}${S.html}</li>
<li>Written out:${colView(a,y,0,S.r,S.c,'AC = '+a,k==='INC'?'+1':'−1',`carry out = ${S.c}  (ignored: C flag stays ${B.C})`)}</li>
<li>Decimal check: ${a} ${k==='INC'?'+':'−'} 1 = ${e}${S.r!==e?`, which wraps round to ${S.r} in 8 bits`:''}.</li>
<li>Carry out of bit 7 = ${S.c}. ${k==='DEC'?(S.c?`This is not an overflow. Adding 1111 1111 means adding 255 = 256 − 1, so for any AC of 1 or more the sum passes 256: ${a} + 255 = ${a+255} = 256 + ${S.r}. The 256 is the carry; it only says "no borrow", because ${a} ≥ 1.`:`No carry, because AC was 0: 0 + 255 = 255 stays below 256. That means a borrow: 0 − 1 wraps round to 255.`):(S.c?`AC was 255, so 255 + 1 = 256 wraps round to 0 and the 256 leaves bit 7.`:`No carry: ${a} + 1 stays below 256.`)}</li>
<li><b>The C flag is not changed by ${k}.</b> The carry out above stays inside the ALU and is thrown away, so C keeps its old value: <b>C = ${B.C}</b>.</li>`;
    c=`Why: INC and DEC are mostly used for loop counters and pointers. If they changed C, a counter update in the middle of a multi-byte ADDC / SUBB chain would destroy the carry that chain still needs. Many real processors (Intel x86, for example) also leave the carry flag alone on INC and DEC. Compare: <b>SUB AC, R1</b> with R1 = 1 gives the same 8-bit result, but it does copy the carry into C.`;
  }else if(k==='NEG'){
    const ac=(~a)&255,S=stepAdd(ac,1,0,{la:'AC′',lb:'+1'});
    h=`<li>AC = ${d(a)}.</li><li>Flip every bit: AC′ = ${bin8(ac)}.</li><li>Add 1:${S.html}</li>
<li>Written out:${colView(ac,1,0,S.r,S.c,'AC′','+1')}</li>
<li>Decimal check: 256 − ${a} = ${256-a}${a===0?', which is 0 in 8 bits':''}. As signed numbers, ${s8(a)} becomes ${s8(S.r)}${a===128?' (−128 has no positive partner in 8 bits)':''}.</li>`;
    c="NEG gives the 2's complement: flip all bits, then add 1.";
  }else if(k==='MUL'){
    const p=a*b;let rows='',parts=[];
    for(let i=0;i<8;i++)if((b>>i)&1){parts.push(a<<i);rows+=`<li>Bit ${i} of R1 is 1 → add AC shifted left ${i} places = ${a} × ${1<<i} = ${a<<i}</li>`;}
    h=`<li>AC = ${d(a)}, R1 = ${d(b)}.</li><li>Shift and add: for every 1-bit of R1, add a copy of AC shifted left by that bit's position.<ul>${rows||'<li>R1 has no 1-bits, so the product is 0</li>'}</ul></li>
<li>Add the partial products: ${parts.join(' + ')||'0'} = ${p}.</li>
<li>The product needs 16 bits: ${p} = ${grp(binN(p,16))}. High byte → R2 = ${bin8(p>>8)} = ${p>>8}. Low byte → AC = ${bin8(p&255)} = ${p&255}.</li>
<li>Check: R2 × 256 + AC = ${p>>8} × 256 + ${p&255} = ${p}.</li>`;
    c='An 8-bit × 8-bit product can need up to 16 bits, so it is split across R2 (high byte) and AC (low byte).';
  }else if(k==='DIV'){
    const q=Math.floor(a/b),rm=a%b;
    h=`<li>AC = ${d(a)}, R1 = ${d(b)}.</li><li>How many times does ${b} fit into ${a}? ${q} times, because ${b} × ${q} = ${b*q}${q?` and ${b} × ${q+1} = ${b*(q+1)} is too big`:''}.</li><li>Remainder: ${a} − ${b*q} = ${rm}.</li>
<li>Quotient → AC = ${d(q)}. Remainder → R2 = ${d(rm)}.</li><li>Check: ${b} × ${q} + ${rm} = ${b*q+rm}, the old AC.</li>`;
    c='Integer division gives two results: the quotient (AC) and the remainder (R2).';
  }
  return calcBox('Step-by-step calculation',`<ol>${h}</ol><div class="concl">${c}</div>`);
}
function machineCalc(o,B,A,ch){
  const k=o.l.split(' ')[0];
  if(o.g==='A')return arithCalc(k,B);
  const nm={AC:'AC',R1:'R1',R2:'R2',M10:'M[10]',M11:'M[11]',OUT:'Output port',IN:'Input port'};
  const src={LD:'M10',ST:'AC',MOV:'AC',IN:'IN',OUT:'AC',PUSH:'AC'}[k];
  let li=ch.filter(x=>x!=='stack').map(x=>`<li>${nm[x]}: ${B[x]===null?'—':B[x]} → <b>${A[x]}</b> (${bin8(A[x])})</li>`).join('');
  if(k==='PUSH')li+=`<li>Stack: ${B.stack.length} → ${A.stack.length} words. New top = ${A.AC} (${bin8(A.AC)}).</li>`;
  if(k==='POP')li+=`<li>Stack: ${B.stack.length} → ${A.stack.length} words. The old top word ${A.R2} was removed.</li>`;
  const note=k==='XCH'?'Both values move at once: the old AC goes to R1 and the old R1 goes to AC.':k==='POP'?'POP copies the top word into R2 and removes it from the stack.':`The source, ${nm[src]}, still holds ${B[src]}: a transfer copies the bits without changing them.`;
  return calcBox('What changed',`<ol>${li}</ol><div class="concl">${note}</div>`);
}
function aluCalc(a,b,op){
  if(op==='TST'){const r=a&b;return calcBox('Step-by-step calculation',`<ol><li>TST does A AND B bit by bit (1 only where both bits are 1):${bitOpTable(a,b,'AND')}</li><li>The result ${bin8(r)} is not stored. Only the flags are kept.</li>
<li>S = left-most result bit = <b>${r>>7}</b>. Z = <b>${r?0:1}</b>, because the result ${r?'is not':'is'} 0000 0000. C and V are cleared.</li></ol>`);}
  const sub=op!=='ADD',bb=sub?(~b)&255:b,cin=sub?1:0,S=stepAdd(a,bb,cin,{la:'A',lb:sub?'B′':'B'}),C7=S.car[7],C8=S.car[8];
  return calcBox('Step-by-step calculation',`<ol>
${sub?`<li>Subtract by adding: A − B = A + B′ + 1. A = ${bin8(a)} (${a}), B = ${bin8(b)} (${b}), so B′ = ${bin8(bb)}. The +1 goes in as the carry into bit 0.</li>`:`<li>A = ${bin8(a)} (${a}), B = ${bin8(b)} (${b}). No carry in.</li>`}
<li>Add column by column. Watch the last two carries: C7 is the carry <i>into</i> bit 7 (out of bit 6), C8 is the carry <i>out of</i> bit 7.${S.html}</li>
<li>Written out:${colView(a,bb,cin,S.r,S.c,'A = '+a,sub?'B′':'B = '+b)}</li>
<li>Read the flags from the table:<ul><li>C = C8 = <b>${C8}</b></li><li>S = F7, the left-most result bit = <b>${S.r>>7}</b></li><li>Z = <b>${S.r?0:1}</b>, because the result ${S.r?'is not':'is'} 0000 0000</li><li>V = C7 ⊕ C8 = ${C7} ⊕ ${C8} = <b>${C7^C8}</b>${C7^C8?' (the two carries differ, so the signed result is wrong)':' (the two carries agree, so the signed result is right)'}</li></ul></li>
</ol>${op==='CMP'?'<div class="concl">CMP does all of this but throws the result away. Only the four flags are kept.</div>':''}`);
}
function shiftCalc(k,old,oc,res,V){
  const right=['SHR','SHRA','ROR','RORC'].includes(k),r=res.r,so=s8(old),sr=s8(r);
  const enter={SHR:'0',SHL:'0',SHRA:`old bit 7 = ${old>>7} (the sign is copied)`,SHLA:'0',ROR:`old bit 0 = ${old&1} (rotated round)`,ROL:`old bit 7 = ${old>>7} (rotated round)`,RORC:`the old C = ${oc}`,ROLC:`the old C = ${oc}`}[k];
  const leave={SHR:'is lost',SHL:'is lost',SHRA:'is lost',SHLA:'is lost',ROR:'goes round to bit 7',ROL:'goes round to bit 0',RORC:'goes into C',ROLC:'goes into C'}[k];
  let dec;
  if(k==='SHR')dec=`Unsigned: ${old} ÷ 2 = ${Math.floor(old/2)} remainder ${old&1}. The remainder is the bit that fell off.`;
  else if(k==='SHL')dec=`Unsigned: ${old} × 2 = ${old*2}${old*2>255?`, more than 255, so only ${old*2} − 256 = ${r} fits in 8 bits`:''}.`;
  else if(k==='SHRA')dec=`Signed: ${so} ÷ 2 = ${so/2} → ${sr} (rounded down). Copying the sign bit keeps the number ${so<0?'negative':'positive'}.`;
  else if(k==='SHLA')dec=`Signed: ${so} × 2 = ${so*2}. ${so*2<-128||so*2>127?`That is outside −128…127, so the 8-bit result (${sr}) is wrong and V = 1: bit 7 changed from ${old>>7} to ${r>>7}.`:`That fits in −128…127, so V = 0: bit 7 stayed ${r>>7}.`}`;
  else dec='A rotate only rearranges the bits. Nothing is lost, so it has no arithmetic meaning.';
  return calcBox('Step-by-step calculation',`<ol>
<li>Start: ${bin8(old)} (${old}${so<0?', signed '+so:''}), C = ${oc}.</li>
<li>Every bit moves one place ${right?'right: bit 7 → 6, 6 → 5, … 1 → 0':'left: bit 0 → 1, 1 → 2, … 6 → 7'}.</li>
<li>The ${right?'right-most bit (bit 0)':'left-most bit (bit 7)'} = ${right?old&1:old>>7} ${leave}.</li>
<li>The empty ${right?'bit 7':'bit 0'} is filled with ${enter}.</li>
<li>Result: ${bin8(r)} (${r}${sr<0?', signed '+sr:''})${k.endsWith('C')?`, and now C = ${res.c}`:''}${k==='SHLA'?`, V = ${V}`:''}.</li>
<li>${dec}</li></ol>`);
}
function seqCalc(I1,I0,T,S1,S0,L,sel,c,CAR,op){
  return calcBox('Step-by-step calculation',`<ol>
<li>Inputs: I1 I0 = ${I1}${I0} (from BR) and T = ${T} (the bit chosen by CD). So I1′ = ${1-I1}.</li>
<li>S1 = I1 = <b>${S1}</b></li>
<li>S0 = I1·I0 + I1′·T = ${I1}·${I0} + ${1-I1}·${T} = ${I1&I0} + ${(1-I1)&T} = <b>${S0}</b></li>
<li>L = I1′·I0·T = ${1-I1}·${I0}·${T} = <b>${L}</b></li>
<li>S1 S0 = ${S1}${S0} = ${sel}, so MUX 1 passes input ${sel}, ${['CAR + 1','AD','SBR','MAP'][sel]} = <b>${c[sel]}</b>.${sel===0?` (${CAR} + 1 = ${CAR+1})`:''}${sel===3?` Mapping puts opcode ${binN(op,4)} into CAR(2–5): 0 ${binN(op,4)} 00 = ${op} × 4 = ${op<<2}.`:''}</li>
${L?`<li>L = 1, so SBR is loaded with the return address: CAR + 1 = ${CAR} + 1 = ${CAR+1}.</li>`:''}</ol>`);
}
function wordCalc(W){const w=(W.I<<15)|(W.op<<11)|W.a;
  return calcBox('Step-by-step calculation',`<ol>
<li>Join the three fields: I = ${W.I} | opcode = ${binN(W.op,4)} | address = ${binN(W.a,11)}.</li>
<li>16-bit word: ${grp(binN(w,16))}. Each group of 4 bits is one hex digit: ${grp(binN(w,16)).split(' ').map(g=>g+' = '+parseInt(g,2).toString(16).toUpperCase()).join(', ')}, so the word is ${hex(w,4)} hex.</li>
<li>Address field: ${binN(W.a,11)} = ${W.a} in decimal.${W.I?` I = 1, so the CPU first reads M[${W.a}] to get the real address.`:''}</li>
<li>Mapping: CAR(2–5) ← opcode, and the other CAR bits ← 0. So CAR = 0 ${binN(W.op,4)} 00 = ${W.op} × 4 = <b>${W.op<<2}</b>${W.op<4?`, the start of the ${OPC[W.op]} routine`:''}.</li></ol>`);}
function numOps(m,o,n){const out=[];
  for(const op of [m.f1,m.f2,m.f3])switch(op){
    case'PCTAR':out.push(`AR ← PC = ${o.PC}`);break;
    case'READ':out.push(`DR ← M[${o.AR}] = ${hex(n.DR,4)} hex (${s16(n.DR)})`);break;
    case'INCPC':out.push(`PC ← ${o.PC} + 1 = ${n.PC}`);break;
    case'DRTAR':out.push(`AR ← DR(0–10) = ${binN(o.DR&0x7FF,11)} = ${n.AR}`);break;
    case'ADD':out.push(`AC ← AC + DR = ${s16(o.AC)} + ${s16(o.DR)} = ${s16(n.AC)}`);break;
    case'ACTDR':out.push(`DR ← AC = ${s16(o.AC)}`);break;
    case'DRTAC':out.push(`AC ← DR = ${s16(o.DR)}`);break;
    case'WRITE':out.push(`M[${o.AR}] ← DR = ${s16(o.DR)}`);break;

/* ---------- arithmetic practice ---------- */
const MB={x:300,y:500,op:'ADD',step:1};
function mbSteps(x,y,op){
  const lx=x&255,hx=x>>8,ly=y&255,hy=y>>8,sub=op==='SUB',cly=sub?(~ly&255):ly,chy=sub?(~hy&255):hy;
  const L=stepAdd(lx,cly,sub?1:0,{la:'X low',lb:sub?'Y low′':'Y low'});
  const H=stepAdd(hx,chy,L.c,{la:'X high',lb:sub?'Y high′':'Y high'});
  const W=stepAdd(hx,chy,sub?1:0);
  const res=(H.r<<8)|L.r,wrong=(W.r<<8)|L.r,truth=sub?x-y:x+y,wrapped=((truth%65536)+65536)%65536;
  const hiExp=sub?hx-hy-(1-L.c):hx+hy+L.c;
  return[
  calcBox('Step 1 · Split each number into two bytes',`<div class="tbl-wrap"><table class="t"><tr><th></th><th>Decimal</th><th>High byte</th><th>Low byte</th><th>Check</th></tr>
<tr><td>X</td><td class="m">${x}</td><td class="m">${bin8(hx)} (${hx})</td><td class="m">${bin8(lx)} (${lx})</td><td class="m">${hx} × 256 + ${lx} = ${x}</td></tr>
<tr><td>Y</td><td class="m">${y}</td><td class="m">${bin8(hy)} (${hy})</td><td class="m">${bin8(ly)} (${ly})</td><td class="m">${hy} × 256 + ${ly} = ${y}</td></tr></table></div>
<p class="note" style="margin:0">High byte = number ÷ 256 (whole part). Low byte = the remainder.</p>`),
  calcBox(`Step 2 · Low bytes with ${sub?'SUB':'ADD'}`,`<ol>${sub?`<li>SUB adds the complement with carry in 1: Y low′ = ${bin8(cly)}.</li>`:'<li>This is the first byte, so no carry comes in.</li>'}

<li>${sub?`${lx} − ${ly} ${lx>=ly?`= ${lx-ly}: no borrow, so <b>C = 1</b>.`:`is negative, so the byte wraps to ${L.r} (= ${lx} + 256 − ${ly}) and a borrow is needed: <b>C = 0</b>.`}`:`${lx} + ${ly} = ${lx+ly}${lx+ly>255?`, more than 255. The byte keeps ${lx+ly} − 256 = ${L.r}, and <b>C = 1</b> carries the 256 up to the high byte.`:`, which fits in one byte: <b>C = 0</b>.`}`}</li></ol>`),

<div class="concl">${sub?'SUB for the lowest byte, SUBB for every byte above it.':'ADD for the lowest byte, ADDC for every byte above it.'}</div>`)];

const PQHINT={ADD:'if the sum is more than 255, subtract 256 and set C = 1; otherwise C = 0.',SUB:'compute AC + R1′ + 1. C = 1 means no borrow (AC ≥ R1); C = 0 means a borrow.',ADDC:'add the old C as well: AC + R1 + C.',SUBB:'SUBB takes away one more when C = 0 (borrow = C′). C afterwards: 1 = no borrow.',INC:'INC does not change C.',DEC:'DEC does not change C, and 0 − 1 wraps round to 255.',NEG:'flip every bit, then add 1. NEG does not change C.',MUL:'the 16-bit product is split: R2 = high byte, AC = low byte.',DIV:'AC gets the quotient and R2 the remainder.',W16:'low byte with ADD, then high byte with ADDC (add the carry from the low byte).'};
const pqFields=k=>k==='W16'?['low','C','high']:(k==='MUL'||k==='DIV')?['AC','R2']:['AC','C'];
function pqPrompt(q){const s=q.s;
  if(q.k==='W16')return`On an 8-bit machine, add <b>${s.x} + ${s.y}</b> using ADD for the low bytes and ADDC for the high bytes. Give the low byte, C after the ADD, and the high byte.`;
  const o=OPS2.find(x=>x.l.split(' ')[0]===q.k);const usesR1=!['INC','DEC','NEG'].includes(q.k);
  return`AC = ${s.AC}${usesR1?`, R1 = ${s.R1}`:''}, C = ${s.C}. Execute <b>${o.l}</b>. What ${q.k==='MUL'||q.k==='DIV'?'are AC and R2':'are AC and C'} afterwards?`;}
function pqAnswer(q){const s=q.s;
  if(q.k==='W16'){const lo=(s.x&255)+(s.y&255),c=lo>255?1:0;return{low:lo&255,C:c,high:((s.x>>8)+(s.y>>8)+c)&255};}
  const o=OPS2.find(x=>x.l.split(' ')[0]===q.k);const save=X2;X2={...structuredClone(X2init),R2:0,...s};o.f(X2);const r={AC:X2.AC,C:X2.C,R2:X2.R2};X2=save;return r;}
function pqWorking(q){const key=pqAnswer(q);
  const body=q.k==='W16'?mbSteps(q.s.x,q.s.y,'ADD').join(''):arithCalc(q.k,{...structuredClone(X2init),R2:0,...q.s});
  return body+`<p class="note"><b>Answer:</b> ${pqFields(q.k).map(f=>`${f} = ${key[f]}`).join(', ')}</p>`;}
const PQ=[['ADD',{AC:200,R1:100,C:0}],['SUB',{AC:50,R1:80,C:0}],['ADDC',{AC:10,R1:20,C:1}],['SUBB',{AC:10,R1:3,C:0}],['DEC',{AC:0,R1:0,C:1}],['NEG',{AC:5,R1:0,C:0}],['MUL',{AC:20,R1:15,C:0}],['DIV',{AC:100,R1:7,C:0}],['W16',{x:1000,y:600}]].map(([k,s])=>({k,s,ans:{},res:null,show:false}));
function pqRandom(){const ks=['ADD','SUB','ADDC','SUBB','INC','DEC','NEG','MUL','DIV','W16'];const k=ks[Math.floor(Math.random()*ks.length)];const R=n=>Math.floor(Math.random()*n);
  const s=k==='W16'?{x:256+R(2800),y:256+R(2800)}:{AC:R(256),R1:k==='DIV'?1+R(20):1+R(255),C:R(2)};return{k,s,ans:{},res:null,show:false};}

const AM={mem:{300:0,301:400,400:700,499:650,500:800,600:900,700:350,702:375,800:425},addr:400,PC:300,R1:500,XR:200,mode:'direct',pmode:'direct',solved:{}};
const MODES=[['direct','Direct'],['immediate','Immediate'],['indirect','Indirect'],['relative','Relative'],['indexed','Indexed'],['register','Register'],['regind','Register indirect'],['autoinc','Autoincrement'],['autodec','Autodecrement']];
const MODE_INFO={direct:'EA = address field.',immediate:'Operand = address field itself (it sits in the 2nd instruction word).',indirect:'EA = M[address field]. The field points to the real address.',relative:'EA = PC + address field, with PC already past the instruction.',indexed:'EA = XR + address field.',register:'Operand = R1. No memory access.',regind:'EA = R1. The register holds the address.',autoinc:'EA = R1, then R1 ← R1 + 1.',autodec:'R1 ← R1 − 1 first, then EA = R1.'};
function amSolve(mode,st=AM){
  const {addr,PC,R1,XR}=st;const M=a=>st.mem[a]??0;
  let ea=null,ac,steps=[],touch={},r1=R1;
  switch(mode){
    case'direct':ea=addr;steps=[`EA = address field = ${addr}`];break;
    case'immediate':ea=PC+1;ac=addr;steps=[`Operand is the address field, held in word ${PC+1}`,`AC ← ${addr}`];break;
    case'indirect':{const p=M(addr);touch[addr]='ptr';ea=p;steps=[`Pointer: M[${addr}] = ${p}`,`EA = ${p}`];break;}
    case'relative':ea=PC+2+addr;steps=[`PC after fetching 2 words = ${PC+2}`,`EA = ${PC+2} + ${addr} = ${ea}`];break;
    case'indexed':ea=XR+addr;steps=[`EA = XR + address = ${XR} + ${addr} = ${ea}`];break;
    case'register':ac=R1;steps=['No EA: the operand is in R1',`AC ← R1 = ${R1}`];break;
    case'regind':ea=R1;steps=[`EA = R1 = ${R1}`];break;
    case'autoinc':ea=R1;r1=R1+1;steps=[`EA = R1 = ${R1}`];break;
    case'autodec':r1=R1-1;ea=r1;steps=[`First R1 ← R1 − 1 = ${r1}`,`EA = ${ea}`];break;
  }
  if(ac===undefined){ac=M(ea);steps.push(`AC ← M[${ea}] = ${ac}`);}
  if(mode==='autoinc')steps.push(`Then R1 ← R1 + 1 = ${r1}`);
  if(ea!==null)touch[ea]=touch[ea]?touch[ea]+' ea':'ea';
  return{ea,ac,steps,touch,r1};
}
function amMemTable(sol){
  AM.mem[301]=AM.addr;
  const addrs=new Set(Object.keys(AM.mem).map(Number));Object.keys(sol.touch).forEach(a=>addrs.add(+a));
  return `<div class="tbl-wrap"><table class="t"><tr><th>Address</th><th>Memory</th><th></th></tr>${[...addrs].sort((a,b)=>a-b).map(a=>{
    const t=sol.touch[a]||'';const cls=t.includes('ea')?'sel':t.includes('ptr')?'sel2':'';
    const c=a===300?'Load to AC · mode':a===301?`${AM.addr} <span class="muted">(address field)</span>`:`<input type="number" data-a="${a}" id="am-m-${a}" value="${AM.mem[a]??0}" aria-label="memory ${a}">`;
    const tags=(a===300||a===301?'<span class="tag ins">instruction</span> ':'')+(t.includes('ptr')?'<span class="tag ptr">pointer</span> ':'')+(t.includes('ea')?'<span class="tag ea">EA</span>':'');
    return`<tr class="${cls}"><td class="m">${a}</td><td class="m">${c}</td><td>${tags}</td></tr>`}).join('')}</table></div>`;
}

{id:'logic',group:'Instruction types',title:'Logic and masks',render(el){

  `<p class="prose"><code>CLR</code> makes every bit 0, <code>COM</code> inverts every bit. <code>CLRC</code>, <code>SETC</code>, <code>COMC</code> act on the carry flag; <code>EI</code> and <code>DI</code> enable and disable interrupts.</p>`+

  tryBox('Single-bit control instructions','carry and interrupt-enable flip-flops',`

    $('#lgV').innerHTML=bitsHTML(LG.v,8,'lgv');$('#lgM').innerHTML=bitsHTML(LG.m,8,'lgm');$('#lgMl').style.opacity=nm?.35:1;$('#lgOpL').textContent=nm?'(no mask)':LG.op+' mask';
    $('#lgR').innerHTML=bitsHTML(r,8,'lgr',{editable:false,hl:ch});

    $('#lgRule').innerHTML=`${LGRULE[LG.op]} <b>${n} bit${n===1?'':'s'} changed</b> (ringed in green).`;$('#lgSteps').innerHTML=logicCalc(LG.v,LG.m,LG.op,r);
    const f=(e,v)=>{e.classList.toggle('set',!!v);e.querySelector('b').textContent=v;};f($('#lgC'),LG.C);f($('#lgI'),LG.IEN);};

{id:'shift',group:'Instruction types',title:'Shift instructions',render(el){
  el.innerHTML=head('Instruction types','Shift instructions','A shift moves every bit one place left or right. The kinds differ only in <b>what enters</b> at one end and <b>where the leaving bit goes</b>.')+
  tbl(['Mnemonic','What enters / where the bit goes'],[['SHR / SHL','a 0 enters; the leaving bit is lost'],['SHRA','the sign bit is copied (signed ÷ 2)'],['SHLA','like SHL; V = 1 if the sign changes'],['ROR / ROL','the leaving bit comes back at the other end'],['RORC / ROLC','C enters; the leaving bit goes into C']])+
  `<h3>SHR vs SHRA: what fills bit 7?</h3>
  <p class="prose">Both instructions do the same thing to bits 6 … 0: every bit moves one place right and bit 0 falls off. The <b>only</b> difference is what goes into the empty bit 7.</p>`+
  tbl(['Instruction','New bit 7 gets','Use it for'],[['SHR','always 0','unsigned numbers (0 to 255)'],['SHRA','a copy of the old bit 7 (the sign bit)','signed numbers (−128 to +127)']])+
  `<div class="callout"><p>In 2's complement, bit 7 is the <b>sign</b>: 0 = positive, 1 = negative. Shifting right should halve the number. SHR puts a 0 in bit 7, so the result is always positive: right for unsigned numbers. SHRA keeps bit 7, so a negative number stays negative: right for signed numbers. <b>They only give different results when bit 7 = 1.</b></p></div>
  <div class="cols">
   <div class="box"><h4>Case 1 · positive: both the same</h4><p>0110 0100 = 100. Old bit 7 is 0, so "insert 0" and "copy bit 7" are the same.</p>
<pre class="calc">bit:   7 6 5 4  3 2 1 0
before 0 1 1 0  0 1 0 0   = 100
SHR    0 0 1 1  0 0 1 0   = 50
SHRA   0 0 1 1  0 0 1 0   = 50</pre><p>Both give 100 ÷ 2 = 50.</p></div>
   <div class="box"><h4>Case 2 · negative: they differ</h4><p>1110 1100 = 236 unsigned, or −20 signed.</p>
<pre class="calc">bit:   7 6 5 4  3 2 1 0
before 1 1 1 0  1 1 0 0   236 / −20
SHR    0 1 1 1  0 1 1 0   = 118
SHRA   1 1 1 1  0 1 1 0   = −10</pre><p>SHR: 236 ÷ 2 = 118, right as unsigned, but −20 became +118. SHRA: −20 ÷ 2 = −10, right as signed.</p></div>
  </div>`+
  tbl(['1110 1100 shifted','Read as unsigned','Read as signed'],[['SHR → 0111 0110','118 ✓ (236 ÷ 2)','+118 ✗ (should be −10)'],['SHRA → 1111 0110','246 ✗','−10 ✓ (−20 ÷ 2)']])+
  `<p class="prose"><b>Odd numbers:</b> SHRA rounds <i>down</i>. The slide example 1011 0011 (−77) becomes 1101 1001 (−39), because −38.5 rounds towards minus infinity. SHR on the same bits gives 0101 1001 (89 = 179 ÷ 2, remainder 1 lost).<br><b>Left shifts:</b> no sign-copying version is needed, because the empty place after a left shift is bit 0. SHL and SHLA give the same bits; SHLA also sets V = 1 if bit 7 changes.</p>`+
  tryBox('Compare SHR and SHRA','both shifts applied to the same value; click bits or pick an example',`
    <div class="bitline"><span class="bitname">value</span><span id="scV"></span></div>
    <div class="row" style="margin-top:10px"><span class="note" style="margin:0">Examples:</span><button class="chip" data-sc="100">0110 0100 (100)</button><button class="chip" data-sc="236">1110 1100 (−20)</button><button class="chip" data-sc="179">1011 0011 (−77)</button><button class="chip" data-sc="128">1000 0000 (−128)</button><button class="chip" data-sc="255">1111 1111 (−1)</button></div>
    <div class="split" style="margin-top:14px" id="scOut"></div>
    <p class="note" id="scMsg"></p>`)+
  tryBox('Shift a byte','starts with the slide example 1011 0011, C = 0; each click shifts the current value',`
    <div class="stack">
      <div class="bitline"><span class="bitname">before</span><span id="shB"></span></div>
      <div class="bitline"><span class="bitname">now</span><span id="shV"></span><span class="bitname" style="min-width:0">C</span><span id="shC"></span></div>
    </div>
    <p class="note" id="shWhat">Pick a shift below. You can also click bits to change the value.</p><div id="shSteps"></div>
    <div class="cells" style="margin:12px 0"><div class="cell"><small>Unsigned</small><strong id="shU"></strong></div><div class="cell"><small>Signed</small><strong id="shS"></strong></div><div class="cell"><small>Overflow V</small><strong id="shVf"></strong></div></div>
    <div class="ops">${Object.entries(SHOPS).map(([k,o])=>`<button class="op" data-sh="${k}"><b>${k}</b><small>${o.d}</small></button>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn ghost sm" id="shReset">Reset to 1011 0011</button></div>
    <div class="lbl">History</div><div class="log" id="shLog"></div>`);
  const draw=()=>{const inb=SH.last?SH.last.inb:-1;
    $('#shB').innerHTML=SH.prev===null?'<span class="muted">—</span>':bitsHTML(SH.prev,8,'shp',{editable:false});
    $('#shV').innerHTML=bitsHTML(SH.v,8,'shv',{inbit:inb});
    $('#shC').innerHTML=`<span class="bits"><button class="bit${SH.C?' on':''}" data-row="shc" data-i="0" aria-label="carry">${SH.C}</button></span>`;
    $('#shU').textContent=SH.v;$('#shS').textContent=s8(SH.v);$('#shVf').textContent=SH.V;
    $('#shLog').innerHTML=SH.hist.length?SH.hist.map(h=>`<div>${h}</div>`).join(''):'<div>No shifts yet</div>';
    if(SH.msg)$('#shWhat').innerHTML=SH.msg;$('#shSteps').innerHTML=SH.calc||'';};
  el.addEventListener('click',e=>{const b=e.target.closest('.bit');
    if(b&&!b.disabled){if(b.dataset.row==='shv'){SH.v^=1<<+b.dataset.i;SH.last=null;SH.calc='';}else if(b.dataset.row==='shc')SH.C^=1;draw();return;}
    const o=e.target.closest('[data-sh]');
    if(o){const k=o.dataset.sh;const r=SHOPS[k].f(SH.v,SH.C);const oc=SH.C;SH.prev=SH.v;SH.v=r.r;SH.C=r.c;SH.V=r.V||0;SH.last=r;
      const inV=(r.r>>r.inb)&1;
      let w=`<b>${k}</b>: bit ${r.inb===7?0:7} (= ${r.out}) left the register and went to <b>${r.to}</b>. `;
      w+=r.copy?`The sign bit (${inV}) was copied into bit 7, so the sign is kept. `:`A ${inV} entered at bit ${r.inb} (ringed). `;
      if(k==='SHLA')w+=r.V?'The sign changed, so V = 1.':'The sign did not change, so V = 0.';
      if(k.endsWith('C'))w+=` C was ${oc}, now ${SH.C}.`;
      SH.msg=w;SH.calc=shiftCalc(k,SH.prev,oc,r,SH.V);SH.hist.unshift(`${k.padEnd(5,' ')} ${grp(binN(SH.prev,8))} → ${grp(binN(SH.v,8))}  C=${SH.C}${k==='SHLA'?' V='+SH.V:''}`);SH.hist=SH.hist.slice(0,10);draw();flash($('#shV'));}
    if(e.target.id==='shReset'){Object.assign(SH,{v:0b10110011,C:0,prev:null,last:null,V:0,hist:[],msg:'Pick a shift below.',calc:''});draw();}});
  draw();
  const scDraw=()=>{const v=SC.v,b7=v>>7,r1=v>>1,r2=(v>>1)|(v&128),u=Math.floor(v/2),sg=Math.floor(s8(v)/2);
    $('#scV').innerHTML=bitsHTML(v,8,'scv');
    const col=(name,r,fill)=>`<div class="box"><h4>${name}: bit 7 ← ${fill}</h4><div class="bitline">${bitsHTML(r,8,'sc'+name,{editable:false,inbit:7})}</div>
      <p style="margin:10px 0 4px">Unsigned: <b>${r}</b> ${r===u?'✓':'✗'} <span class="muted">(${v} ÷ 2 = ${u})</span></p>
      <p style="margin:0">Signed: <b>${s8(r)}</b> ${s8(r)===sg?'✓':'✗'} <span class="muted">(${s8(v)} ÷ 2 = ${s8(v)/2}${s8(v)%2?` → ${sg}`:''})</span></p></div>`;
    $('#scOut').innerHTML=col('SHR',r1,'0')+col('SHRA',r2,`old bit 7 = ${b7}`);
    $('#scMsg').innerHTML=b7?`Bit 7 is <b>1</b>, so the results differ. SHR is right if you read the value as unsigned (${v}); SHRA is right if you read it as signed (${s8(v)}).`:`Bit 7 is <b>0</b> (a positive number), so SHR and SHRA give exactly the same bits.`;};
  $('#scV').onclick=e=>{const b=e.target.closest('.bit');if(!b)return;SC.v^=1<<+b.dataset.i;scDraw();};
  el.addEventListener('click',e=>{const c=e.target.closest('[data-sc]');if(c){SC.v=+c.dataset.sc;scDraw();}});
  scDraw();
}},

{id:'status',group:'Program control',title:'Status bits',render(el){

/* ---------- RISC / CISC ---------- */
{id:'risc',group:'RISC and CISC',title:'RISC vs CISC',render(el){
  el.innerHTML=head('Processor design','RISC versus CISC','Two ways to design an instruction set. <b>CISC</b> gives the machine many powerful instructions so each statement needs few of them. <b>RISC</b> keeps instructions few and simple so each runs in about one cycle.')+
  `<div class="cols"><div class="box"><h4>CISC</h4><ul><li>100–250 instructions, 5–20 addressing modes</li><li>Variable-length formats</li><li>Arithmetic can use memory operands</li><li>Microprogrammed control · x86, VAX</li></ul></div>
  <div class="box"><h4>RISC</h4><ul><li>Few instructions and addressing modes</li><li>Only load and store touch memory</li><li>Fixed length, one instruction per cycle (pipelining)</li><li>Hardwired control, many registers · ARM, MIPS, RISC-V</li></ul></div></div>`+
  tryBox('Same statement, two instruction sets','A, B, C and X are in memory',`
    <div class="lbl">Statement</div>${seg(RC.map((r,i)=>[i,r.s]),RCi,'rcSeg')}
    <div class="split" style="margin-top:14px"><div><div class="lbl">CISC</div><div class="enc" id="rcC"></div></div><div><div class="lbl">RISC</div><div class="enc" id="rcR"></div></div></div>

/* ================= MACHINE (transfer + arithmetic) ================= */
const X2init={AC:12,R1:5,R2:0,C:0,M10:25,M11:0,IN:42,OUT:null,stack:[]};
let X2=structuredClone(X2init),x2log=[],x2g='T';const X2CALC={T:'',A:''};
const REGS2=[['AC','AC'],['R1','R1'],['R2','R2'],['C','Carry C'],['M10','M[10]'],['M11','M[11]'],['IN','Input port'],['OUT','Output port']];
const addC=r=>{X2.C=r>255?1:0;return r&255;};
const OPS2=[
 {g:'T',l:'LD M[10]',r:'AC ← M[10]',f:s=>{s.AC=s.M10;return['AC']}},
 {g:'T',l:'ST M[11]',r:'M[11] ← AC',f:s=>{s.M11=s.AC;return['M11']}},
 {g:'T',l:'MOV R1, AC',r:'R1 ← AC',f:s=>{s.R1=s.AC;return['R1']}},
 {g:'T',l:'XCH AC, R1',r:'AC ↔ R1',f:s=>{[s.AC,s.R1]=[s.R1,s.AC];return['AC','R1']}},
 {g:'T',l:'IN',r:'AC ← input port',f:s=>{s.AC=s.IN;return['AC']}},
 {g:'T',l:'OUT',r:'output port ← AC',f:s=>{s.OUT=s.AC;return['OUT']}},
 {g:'T',l:'PUSH AC',r:'stack ← AC',f:s=>{if(s.stack.length>=4)return{err:'Stack full (4 words). POP first.'};s.stack.push(s.AC);return['stack']}},
 {g:'T',l:'POP R2',r:'R2 ← stack',f:s=>{if(!s.stack.length)return{err:'Stack empty. PUSH first.'};s.R2=s.stack.pop();return['R2','stack']}},
 {g:'A',l:'INC AC',r:'AC ← AC + 1',f:s=>{s.AC=(s.AC+1)&255;return['AC']}},
 {g:'A',l:'DEC AC',r:'AC ← AC − 1',f:s=>{s.AC=(s.AC+255)&255;return['AC']}},

  const P=preview(),m=P.m,o={PC:MP.PC,AR:MP.AR,DR:MP.DR,AC:MP.AC},n={...o},ch=[],w=[];
  for(const op of [m.f1,m.f2,m.f3])switch(op){
    case'ADD':n.AC=(o.AC+o.DR)&0xFFFF;break;case'CLRAC':n.AC=0;break;case'INCAC':n.AC=(o.AC+1)&0xFFFF;break;case'DRTAC':n.AC=o.DR;break;
    case'DRTAR':n.AR=o.DR&0x7FF;break;case'PCTAR':n.AR=o.PC;break;case'WRITE':w.push([o.AR,o.DR]);break;
    case'READ':n.DR=rd(o.AR);break;case'ACTDR':n.DR=o.AC;break;case'INCDR':n.DR=(o.DR+1)&0xFFFF;break;
    case'INCPC':n.PC=(o.PC+1)&0x7FF;break;case'ARTPC':n.PC=o.AR;break;}
  ['PC','AR','DR','AC'].forEach(k=>{if(n[k]!==o[k])ch.push(k);MP[k]=n[k];});
  w.forEach(([a,v])=>{MP.mem[a]=v;ch.push('M'+a);});
  const cur=MP.CAR;if(P.L){MP.SBR=cur+1;ch.push('SBR');}MP.CAR=P.next;ch.push('CAR');MP.micro++;if(MP.CAR===64)MP.instr++;
  const nx=['CAR ← CAR + 1','CAR ← AD','CAR ← SBR','CAR ← MAP'][P.sel];
  MP.log.unshift(`${String(cur).padStart(2,' ')}: ${(opsOf(m).map(x=>RTL[x]).join(', ')||'no micro-op').padEnd(26,' ')} ${nx} = ${P.next}${P.L?', SBR ← '+(cur+1):''}`);MP.log=MP.log.slice(0,10);
  let ex;
  if(m.br==='MAP')ex=`Opcode ${binN((o.DR>>11)&0xF,4)} is mapped to 0 ${binN((o.DR>>11)&0xF,4)} 00 = ${P.next}, the start of its routine.`;
  else if(m.br==='CALL')ex=P.T?`I = 1, so the address is indirect: CALL INDRCT and save return address ${cur+1} in SBR.`:`I = 0 (direct address), so no call: continue at ${cur+1}.`;
  else if(m.br==='RET')ex=`AR now holds the real address. Return: CAR ← SBR = ${P.next}.`;
  else if(m.cd==='S')ex=P.T?'AC is negative (S = 1): branch to OVER.':'AC is not negative (S = 0): no branch, back to FETCH.';
  else if(P.next===64)ex=`${phaseOf(cur)} done: back to FETCH at 64.`;
  else ex=`${phaseOf(cur)}: ${opsOf(m).map(x=>RTL[x]).join(', ')||'no operation'}.`;
  MP.msg=ex;MP.nums=numOps(m,o,n);mpChanged=ch;mpRender();return true;
}
function mpStop(){clearInterval(mpTimer);mpTimer=null;const b=$('#mpRun');if(b)b.textContent='Run';}
function mpRender(full){
  const m=CM[MP.CAR],P=MP.halted?null:preview();
  $('#mpPhase').innerHTML=`<span class="phase">${MP.halted?'Halted':phaseOf(MP.CAR)}</span>`;
  $('#mpCount').textContent=`${MP.micro} microinstructions · ${MP.instr} instructions`;
  $('#mpMsg').innerHTML=MP.msg+(MP.nums&&MP.nums.length?`<br><b>In numbers:</b> <span style="font-family:var(--mono)">${MP.nums.join(' · ')}</span>`:'');
  const r=(k,v,b,d)=>`<div class="cell" data-k="${k}"><small>${k} · ${b} bits</small><strong>${d}</strong><span class="sub">${grp(binN(v,b))}</span></div>`;
  $('#mpRegs').innerHTML=r('PC',MP.PC,11,MP.PC)+r('AR',MP.AR,11,MP.AR)+r('DR',MP.DR,16,s16(MP.DR))+r('AC',MP.AC,16,s16(MP.AC))+r('CAR',MP.CAR,7,MP.CAR)+r('SBR',MP.SBR,7,MP.SBR);
  mpChanged.forEach(k=>flash($(`#mpRegs .cell[data-k="${k}"]`)));
  $('#mpFields').innerHTML=fieldsHTML(m);
  const ops=opsOf(m);$('#mpOps').innerHTML=ops.length?ops.map(o=>`<li>${o}: ${RTL[o]}</li>`).join(''):'<li>NOP: no data-path change this clock</li>';
  if(P){const cv={U:1,I:(MP.DR>>15)&1,S:(MP.AC>>15)&1,Z:MP.AC===0?1:0};
    $('#mpSeq').innerHTML=`<div class="seqblk"><b>MUX 2 · select CD = ${m.cd}</b><div class="mux">${CDN.map(k=>`<span class="${k===m.cd?'pick':''}">${k==='U'?'1':k} = ${cv[k]}</span>`).join('')}</div></div>
    <div class="arrow">↓ T = ${P.T}</div>
    <div class="seqblk"><b>Input logic · BR = ${m.br} (${P.I1}${P.I0}), T = ${P.T}</b><span style="font-family:var(--mono);font-size:14px">S1 = I1 = <b>${P.S1}</b><br>S0 = I1·I0 + I1′·T = ${P.I1}·${P.I0} + ${1-P.I1}·${P.T} = <b>${P.S0}</b><br>L = I1′·I0·T = ${1-P.I1}·${P.I0}·${P.T} = <b>${P.L}</b>${P.L?' → SBR ← '+(MP.CAR+1):''}</span></div>
    <div class="arrow">↓</div>
    <div class="seqblk"><b>MUX 1 · next address</b><div class="mux">${['CAR + 1','AD','SBR','MAP'].map((n,i)=>`<span class="${i===P.sel?'pick':''}">${n}<br>= ${P.cands[i]}</span>`).join('')}</div></div>
    <div class="arrow">↓ next CAR = ${P.next}</div>`;}
  else $('#mpSeq').innerHTML='<p class="note">Halted.</p>';
  $('#mpCM').innerHTML=`<tr><th>Addr</th><th>Label</th><th>Symbolic</th><th>Binary</th></tr>`+Object.entries(CM).map(([a,x])=>`<tr class="${+a===MP.CAR&&!MP.halted?'sel':''}"><td class="m">${a}</td><td>${x.label}</td><td class="m">${symOf(x)}</td><td class="m">${binN(F1N.indexOf(x.f1),3)} ${binN(F2N.indexOf(x.f2),3)} ${binN(F3N.indexOf(x.f3),3)} ${binN(CDN.indexOf(x.cd),2)} ${binN(BRN.indexOf(x.br),2)} ${binN(x.ad,7)}</td></tr>`).join('');
  if(full||!$('#mpMem').dataset.built){$('#mpMem').dataset.built='1';
    $('#mpMem').innerHTML=`<tr><th>Addr</th><th>I</th><th>Opcode</th><th>Address / value</th><th>Word</th><th></th></tr>`+
      PROG.map((p,i)=>`<tr data-ma="${i}"><td class="m">${i}</td><td><input type="checkbox" id="mp-i-${i}" data-pi="${i}" ${p.I?'checked':''} ${p.op<0?'disabled':''} aria-label="indirect row ${i}"></td><td><select id="mp-o-${i}" data-po="${i}" aria-label="opcode row ${i}"><option value="-1">—</option>${OPC.map((o,k)=>`<option value="${k}" ${p.op===k?'selected':''}>${o}</option>`).join('')}</select></td><td><input type="number" id="mp-a-${i}" data-pa="${i}" value="${p.a}" ${p.op<0?'disabled':''} aria-label="address row ${i}"></td><td class="m wd"></td><td class="mk"></td></tr>`).join('')+
      Object.keys(DATA).map(a=>`<tr data-ma="${a}"><td class="m">${a}</td><td></td><td class="muted">data</td><td><input type="number" id="mp-d-${a}" data-pd="${a}" value="${DATA[a]}" aria-label="data ${a}"></td><td class="m wd"></td><td class="mk"></td></tr>`).join('');}
  $$('#mpMem tr[data-ma]').forEach(tr=>{const a=+tr.dataset.ma,v=rd(a);tr.querySelector('.wd').textContent=hex(v,4)+(a>=100?` (${s16(v)})`:'');
    tr.querySelector('.mk').innerHTML=(a===MP.PC&&!MP.halted?'◂PC ':'')+(a===MP.AR?'◂AR':'');
    tr.classList.toggle('sel',a===MP.PC&&!MP.halted);tr.classList.toggle('sel2',a===MP.AR&&a!==MP.PC);
    if(mpChanged.includes('M'+a))flash(tr.querySelector('.wd'));});
  $('#mpLog').innerHTML=MP.log.length?MP.log.map(l=>`<div style="white-space:pre">${l}</div>`).join(''):'<div>Press Step micro</div>';
  $('#mpStep').disabled=$('#mpInstr').disabled=MP.halted;
}

/* ================= QUIZ ================= */
const QZ=[
 {q:'A two-word instruction is at 300–301 with address field 400. In relative mode, what is the EA?',o:['400','700','702','302'],k:2,w:'PC is 302 after fetching both words, so EA = 302 + 400 = 702.'},
 {q:'Which mode changes the register after it has been used?',o:['Register indirect','Autoincrement','Autodecrement','Indexed'],k:1,w:'Autoincrement uses R1 as the EA, then adds 1. Autodecrement subtracts first.'},
 {q:'To add two 16-bit numbers on an 8-bit CPU you use:',o:['ADD for both bytes','ADD for the low byte, then ADDC for the high byte','ADDC for the low byte, then ADD for the high byte','INC for the high byte'],k:1,w:'The low byte has no carry coming in, so ADD. The high byte must also add the carry from the low byte, so ADDC.'},
 {q:'Which mask clears the low 4 bits of a byte with AND?',o:['0000 1111','1111 0000','1111 1111','0000 0000'],k:1,w:'AND with 0 clears, with 1 keeps. 1111 0000 keeps the high bits and clears the low 4.'},
 {q:'SHRA on 1000 0100 gives:',o:['0100 0010','1100 0010','0000 1000','0100 0011'],k:1,w:'Arithmetic shift right copies the sign bit (1) into bit 7.'},
 {q:'The overflow bit V equals:',o:['C8','F7','C7 ⊕ C8','C7 · C8'],k:2,w:'Overflow happens when the carry into bit 7 and the carry out of it differ.'},
 {q:'How is CMP different from SUB?',o:['It adds instead','It does not store the result, only sets status bits','It changes PC','It works only on memory'],k:1,w:'CMP computes A − B only to set the status bits for a later branch.'},
 {q:'After A − B with A = 20, B = 240 (unsigned), C is 0. What does that tell you?',o:['A ≥ B','A < B','A = B','Overflow'],k:1,w:'With subtraction done as A + B′ + 1, C = 0 means a borrow occurred, so A < B.'},
 {q:'Which is a RISC feature?',o:['Variable-length instructions','Only load and store access memory','Microprogrammed control','5 to 20 addressing modes'],k:1,w:'RISC is a load/store architecture; the others describe CISC.'},

 {q:'In the sequencer, L = 1 (load SBR) when:',o:['BR = RET','BR = CALL and T = 1','BR = MAP','BR = JMP and T = 1'],k:1,w:'L = I1′·I0·T: only a taken CALL saves the return address.'},
];

/* ================= NAV (same as the practicals site) ================= */
const idx=id=>SECTIONS.findIndex(s=>s.id===id);
let cur=SECTIONS[0].id;
function renderToc(){let g=null,h='';
  SECTIONS.forEach(s=>{if(s.group!==g){if(g!==null)h+='</ol>';g=s.group;h+=`<h4>${g}</h4><ol>`;}
    h+=`<li><a href="#${s.id}" ${s.id===cur?'aria-current="page"':''}><span class="tick">${SEEN[s.id]?'&#10003;':''}</span>${s.title}</a></li>`;});
  $('#toc').innerHTML=h+'</ol>';}
function go(id){if(location.hash!=='#'+id)location.hash=id;else show(id);}
function show(id){
  if(idx(id)<0)id=SECTIONS[0].id;cur=id;const i=idx(id),s=SECTIONS[i];
  pcStop();mpStop();
  SEEN[id]=1;try{localStorage.setItem(KEY+'-seen',JSON.stringify(SEEN))}catch(e){}
  const m=$('#main');
  m.innerHTML=`<section class="sec${s.wide?' wide':''}" id="sec"></section><nav class="pager" aria-label="Page navigation">
    <button class="btn ghost" id="prv" ${i===0?'disabled':''}>&larr; Previous</button>
    <div class="mid">${i+1} of ${SECTIONS.length}<br><span>Use &larr; &rarr; keys</span></div>
    <button class="btn" id="nxt" ${i===SECTIONS.length-1?'disabled':''}>Next &rarr;</button></nav>`;
  s.render($('#sec'));
  $('#prv').onclick=()=>go(SECTIONS[i-1].id);$('#nxt').onclick=()=>go(SECTIONS[i+1].id);
  $('#progBar').style.width=((i+1)/SECTIONS.length*100)+'%';
  renderToc();document.body.classList.remove('toc-open');window.scrollTo(0,0);
}
addEventListener('hashchange',()=>show(location.hash.slice(1)));
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){e.preventDefault();go(b.dataset.go);}});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select')||e.altKey||e.ctrlKey||e.metaKey)return;const i=idx(cur);
  if(e.key==='ArrowRight'&&i<SECTIONS.length-1)go(SECTIONS[i+1].id);if(e.key==='ArrowLeft'&&i>0)go(SECTIONS[i-1].id);});
$('#menuBtn').onclick=()=>document.body.classList.toggle('toc-open');
$('#scrim').onclick=()=>document.body.classList.remove('toc-open');
$('#themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem(KEY+'-theme',r.dataset.theme)}catch(e){}};
try{const th=localStorage.getItem(KEY+'-theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}
show(location.hash.slice(1)||SECTIONS[0].id);
</script>
